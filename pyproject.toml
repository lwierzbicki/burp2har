[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "burp2har"
dynamic = ["version"]
description = "Convert Burp Suite XML exports into HAR 1.2 files"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Lukasz Wierzbicki" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://github.com/lwierzbicki/burp2har"

[project.scripts]
burp2har = "burp2har:main"

[tool.setuptools]
py-modules = ["burp2har"]

[tool.setuptools.dynamic]
version = { attr = "burp2har.__version__" }

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
