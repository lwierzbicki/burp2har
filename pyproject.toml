[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "burp2har"
description = "Convert a Burp Suite XML export (Save items -> XML) into a HAR 1.2 file"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lukasz Wierzbicki" }]
keywords = ["burp", "har", "http", "proxy", "convert", "pentest", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
]
dependencies = ["click>=8.1"]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
burp2har = "burp2har.cli:cli"

[project.urls]
Homepage = "https://github.com/lwierzbicki/burp2har"
Issues = "https://github.com/lwierzbicki/burp2har/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
# Points at the literal in core.py so setuptools reads it statically (AST) at
# build time without importing the package (which would require click).
version = { attr = "burp2har.core.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=burp2har --cov-report=term-missing --cov-fail-under=80 --cov-config=pyproject.toml"
markers = [
    "unit: no external I/O",
    "integration: exercises the CLI end to end",
    "slow: >10s",
]

[tool.coverage.run]
omit = ["src/burp2har/cli.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["burp2har"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
